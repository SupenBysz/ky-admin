name: CI/CD Pipeline

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]

jobs:
    test:
        name: Tests
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: rootpassword
                    MYSQL_DATABASE: ky_admin_test
                    MYSQL_USER: test_user
                    MYSQL_PASSWORD: test_password
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

            redis:
                image: redis:7.0-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - name: Set up Go
              uses: actions/setup-go@v2
              with:
                  go-version: ^1.20

            - name: Check out code
              uses: actions/checkout@v2

            - name: Cache Go modules
              uses: actions/cache@v2
              with:
                  path: ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-

            - name: Install dependencies
              run: cd ky-admin && go mod download

            - name: Create test configuration
              run: |
                  cd ky-admin
                  cp configs/test.yaml configs/config.test.yaml

            - name: Run tests
              run: cd tests && make test-all

            - name: Archive test reports
              uses: actions/upload-artifact@v2
              with:
                  name: test-reports
                  path: tests/reports
                  retention-days: 14

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

        steps:
            - name: Check out code
              uses: actions/checkout@v2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v1

            - name: Login to DockerHub
              uses: docker/login-action@v1
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Extract branch name
              shell: bash
              run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

            - name: Extract version from package.json
              shell: bash
              run: |
                  VERSION=$(cat ky-admin/package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d ' ')
                  echo "VERSION=$VERSION" >> $GITHUB_ENV

            - name: Build and push Docker image
              uses: docker/build-push-action@v2
              with:
                  context: .
                  file: ./docker/Dockerfile
                  push: true
                  tags: |
                      kysion/ky-admin:latest
                      kysion/ky-admin:${{ env.VERSION }}
                      kysion/ky-admin:${{ env.BRANCH_NAME }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy-dev:
        name: Deploy to Development
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

        steps:
            - name: Executing remote SSH commands
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.DEV_SSH_HOST }}
                  username: ${{ secrets.DEV_SSH_USERNAME }}
                  key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
                  port: ${{ secrets.DEV_SSH_PORT }}
                  script: |
                      cd /opt/ky-admin
                      docker-compose pull
                      docker-compose up -d
                      docker image prune -f

    deploy-prod:
        name: Deploy to Production
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        environment: production

        steps:
            - name: Executing remote SSH commands
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.PROD_SSH_HOST }}
                  username: ${{ secrets.PROD_SSH_USERNAME }}
                  key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
                  port: ${{ secrets.PROD_SSH_PORT }}
                  script: |
                      cd /opt/ky-admin
                      docker-compose pull
                      docker-compose up -d
                      docker image prune -f
