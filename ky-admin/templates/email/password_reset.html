<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码重置</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            max-width: 150px;
            margin-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-top: 0;
        }
        .content {
            margin-bottom: 30px;
        }
        .button {
            display: inline-block;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 4px;
            font-weight: bold;
            margin: 20px 0;
        }
        .button:hover {
            background-color: #2980b9;
        }
        .footer {
            font-size: 12px;
            color: #7f8c8d;
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        .warning {
            color: #e74c3c;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://example.com/logo.png" alt="公司标志" class="logo">
            <h1>密码重置</h1>
        </div>
        
        <div class="content">
            <p>尊敬的 {{.Username}}，</p>
            <p>我们收到了重置您账户密码的请求。如果这不是您本人操作，请忽略此邮件。</p>
            <p>要重置您的密码，请点击下面的按钮：</p>
            
            <div style="text-align: center;">
                <a href="{{.ResetLink}}" class="button">重置密码</a>
            </div>
            
            <p>或者，您可以复制以下链接到浏览器地址栏：</p>
            <p><a href="{{.ResetLink}}">{{.ResetLink}}</a></p>
            
            <p class="warning">请注意：此链接将在 {{.ExpiresIn}} 后过期。</p>
        </div>
        
        <div class="footer">
            <p>此邮件由系统自动发送，请勿直接回复。</p>
            <p>&copy; 2024 Kysion. 保留所有权利。</p>
        </div>
    </div>
</body>
</html>
