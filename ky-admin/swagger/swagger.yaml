basePath: /api
definitions:
  api.RefreshTokenRequest:
    properties:
      refresh_token:
        description: 刷新令牌
        type: string
    required:
    - refresh_token
    type: object
  api.RefreshTokenResponse:
    properties:
      refresh_token:
        description: 新刷新令牌
        type: string
      token:
        description: 新访问令牌
        type: string
    type: object
  api.Response:
    properties:
      code:
        description: 响应码
        type: integer
      data:
        description: 响应数据
      message:
        description: 响应消息
        type: string
    type: object
  api.TokenResponse:
    properties:
      refresh_token:
        description: 刷新令牌
        type: string
      token:
        description: 访问令牌
        type: string
      user:
        description: 用户信息
    type: object
  dto.ForgotPasswordDTO:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.LoginDTO:
    properties:
      password:
        description: 密码
        example: password123
        type: string
      username:
        description: 用户名
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  dto.RegisterDTO:
    properties:
      email:
        description: 邮箱
        example: admin@example.com
        type: string
      nickname:
        description: 昵称
        example: 管理员
        type: string
      password:
        description: 密码
        example: password123
        type: string
      phone:
        description: 电话
        example: "13800138000"
        type: string
      role_ids:
        description: 角色ID列表
        items:
          type: integer
        type: array
      username:
        description: 用户名
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  dto.ResetPasswordDTO:
    properties:
      new_password:
        minLength: 6
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  dto.RoleDTO:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.UserResponseDTO:
    properties:
      avatar:
        description: 头像
        type: string
      created_at:
        description: 创建时间
        type: string
      dept_id:
        description: 部门ID
        type: integer
      email:
        description: 邮箱
        type: string
      id:
        description: 用户ID
        type: integer
      last_login_at:
        description: 最后登录时间
        type: string
      nickname:
        description: 昵称
        type: string
      permissions:
        description: 权限列表
        items:
          type: string
        type: array
      phone:
        description: 电话
        type: string
      roles:
        description: 角色列表
        items:
          $ref: '#/definitions/dto.RoleDTO'
        type: array
      status:
        description: 状态
        type: integer
      tenant_id:
        description: 租户ID
        type: integer
      updated_at:
        description: 更新时间
        type: string
      username:
        description: 用户名
        type: string
    type: object
  response.Response:
    properties:
      code:
        description: 业务代码
        type: integer
      data:
        description: 数据
      message:
        description: 消息
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@kysion.com
    name: API Support
    url: http://www.kysion.com/support
  description: KY-Admin后台管理系统API文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: KY-Admin API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 用户登录接口
      parameters:
      - description: 登录信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.LoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.TokenResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: 认证失败
          schema:
            $ref: '#/definitions/api.Response'
      summary: 用户登录
      tags:
      - 认证管理
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      description: 刷新用户访问令牌
      parameters:
      - description: 刷新令牌信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/api.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.RefreshTokenResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: 令牌无效
          schema:
            $ref: '#/definitions/api.Response'
      summary: 刷新令牌
      tags:
      - 认证管理
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: 用户注册接口
      parameters:
      - description: 注册信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponseDTO'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/api.Response'
      summary: 用户注册
      tags:
      - 认证管理
  /api/v1/password/forgot:
    post:
      consumes:
      - application/json
      description: 通过邮箱请求密码重置
      parameters:
      - description: 忘记密码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: boolean
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 请求密码重置
      tags:
      - 密码
  /api/v1/password/reset:
    post:
      consumes:
      - application/json
      description: 使用令牌重置密码
      parameters:
      - description: 重置密码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: boolean
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 重置密码
      tags:
      - 密码
  /api/v1/password/validate-token:
    get:
      consumes:
      - application/json
      description: 验证密码重置令牌是否有效
      parameters:
      - description: 重置令牌
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: boolean
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 验证重置令牌
      tags:
      - 密码
  /health:
    get:
      consumes:
      - application/json
      description: 返回服务健康状态
      produces:
      - application/json
      responses:
        "200":
          description: 服务健康
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
      summary: 健康检查接口
      tags:
      - 健康检查
  /livez:
    get:
      consumes:
      - application/json
      description: 用于Kubernetes存活探测
      produces:
      - application/json
      responses:
        "200":
          description: 服务存活
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
      summary: 存活探针
      tags:
      - 健康检查
  /readyz:
    get:
      consumes:
      - application/json
      description: 用于Kubernetes就绪探测
      produces:
      - application/json
      responses:
        "200":
          description: 服务就绪
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
      summary: 就绪探针
      tags:
      - 健康检查
schemes:
- http
- https
swagger: "2.0"
