# 测试配置文件
# 路径配置
paths:
    project_root: '..' # 相对于tests目录的项目根目录
    reports_dir: '../../temp/test-reports' # 测试报告目录
    fixtures_dir: 'fixtures' # 测试数据目录

# 测试服务器配置
server:
    host: 'localhost'
    port: 8089

# 覆盖率阈值配置
coverage:
    threshold:
        statement: 70
        function: 80
        branch: 60
        line: 70

# 数据库配置
database:
    host: 'localhost'
    port: 3306
    user: 'test_user'
    password: 'test_password'
    name: 'test_db'
    driver: sqlite
    database: ':memory:'
    show_sql: true
    log_level: debug
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: 3600

# 测试类型
test_types:
    - name: 'api'
      directory: 'api'
      description: 'API测试'
    - name: 'unit'
      directory: 'unit'
      description: '单元测试'
    - name: 'integration'
      directory: 'integration'
      description: '集成测试'
    - name: 'performance'
      directory: 'performance'
      description: '性能测试'

app:
    name: ky-admin-test
    mode: test
    port: 8080
    version: 1.0.0

log:
    level: debug
    filename: logs/test.log
    maxsize: 100
    maxbackups: 10
    maxage: 30
    compress: true

jwt:
    secret: test-jwt-secret-key
    expire_time: 86400
    issuer: ky-admin-test

cors:
    allow_origins:
        - '*'
    allow_methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
    allow_headers:
        - Origin
        - Content-Type
        - Accept
        - Authorization
    expose_headers:
        - Content-Length
    allow_credentials: true
    max_age: 86400

rate_limit:
    enable: false
    rate: 100
    capacity: 100

test:
    report_dir: '/Volumes/DataDocument/CodeSpace/AI Solution/kysion.com/backend/temp/test-reports'
    mock_data_dir: '/Volumes/DataDocument/CodeSpace/AI Solution/kysion.com/backend/ky-admin/tests/fixtures'
